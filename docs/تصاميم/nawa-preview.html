<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نواة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--panel:#f6f6f4;--ink:#1f1b13;--mut:#5f5a4e;--line:#dcdbd5;--acc:#9a6b12;--acc2:#0f5c5a;--accbg:#ebebe7;--btn:#e4e4e0;--btnh:#d8d8d3;--btnline:#c9c8c1;--ok:#1f7a4d;--bad:#a63a2a;--rad:10px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14110b;--panel:#1c1810;--ink:#efe7d3;--mut:#a79c82;--line:#35301f;--acc:#d9a845;--acc2:#5fc2bd;--accbg:#2e2612;--btn:#2b2619;--btnh:#383121;--btnline:#4a4330}}
:root[data-theme=dark]{--bg:#14110b;--panel:#1c1810;--ink:#efe7d3;--mut:#a79c82;--line:#35301f;--acc:#d9a845;--acc2:#5fc2bd;--accbg:#2e2612;--btn:#2b2619;--btnh:#383121;--btnline:#4a4330}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 Cairo,Tahoma,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}

/* الشريط العلوي: صف واحد، أعمدة متساوية */
header.top{background:var(--bg);border-bottom:1px solid var(--line);flex:none}
header.top .in{max-width:1180px;margin:0 auto;padding:0 16px;height:58px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;color:var(--ink);text-decoration:none}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--acc);color:#fff;font-style:normal;font-size:22px;line-height:1}
nav.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:640px;width:100%;justify-self:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
nav.tabs a{height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14.5px;font-weight:600;white-space:nowrap}
nav.tabs a:hover{background:var(--accbg)}
nav.tabs a.on{background:var(--bg);box-shadow:0 0 0 1px var(--btnline)}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{height:36px;min-width:36px;padding:0 12px;border-radius:9px;background:var(--btn);border:1px solid var(--btnline);cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.ibtn:hover{background:var(--btnh)}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* مساحة العمل */
.app{flex:1;min-height:0;display:flex}
aside.side{width:260px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:12px;gap:10px}
.newchat{height:40px;border-radius:10px;border:1px solid var(--btnline);background:var(--bg);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.newchat:hover{background:var(--btnh)}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.hist h6{margin:10px 8px 4px;font-size:12px;color:var(--mut);font-weight:700}
.hist button{text-align:right;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover,.hist button.on{background:var(--accbg)}
.hist .none{color:var(--mut);font-size:13.5px;padding:8px 10px}
main.ws{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow:auto;padding:28px 16px 12px}
.col{max-width:760px;margin:0 auto}
.hero{min-height:46vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.hero .mark{width:54px;height:54px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800;line-height:1;margin-bottom:8px}
.hero h1{margin:0;font-size:28px;font-weight:800}
.msg{display:flex;gap:12px;margin:18px 0}
.msg .av{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px}
.msg.u .av{background:var(--accbg)}
.msg.a .av{background:var(--acc);color:#fff}
.msg .tx{white-space:pre-wrap;word-break:break-word;padding-top:2px}
.msg.u .tx{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.dock{flex:none;padding:6px 16px 16px}
.composer{max-width:760px;margin:0 auto;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:10px 12px 8px;transition:border-color .15s}
.composer:focus-within{border-color:var(--acc)}
.composer textarea{width:100%;border:0;outline:0;background:none;resize:none;color:var(--ink);font:500 16px/1.8 Cairo,sans-serif;max-height:200px;min-height:30px;padding:2px 4px}
.crow{display:flex;align-items:center;gap:6px;margin-top:4px}
.crow .sp{flex:1}
.cbtn{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;display:grid;place-items:center;position:relative}
.cbtn:hover{background:var(--accbg)}
.cbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.send{background:var(--acc);color:#fff}
.send:hover{background:var(--acc);filter:brightness(1.08)}
.send[disabled]{opacity:.4;cursor:default}
.chipsrow{max-width:760px;margin:12px auto 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:7px 15px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font:600 14px Cairo;color:var(--ink)}
.chip:hover{border-color:var(--acc)}
.attached{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.att{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:13px}
.att b{font-weight:700;color:var(--acc2)}

/* قائمة + */
.menu{position:absolute;bottom:44px;right:0;min-width:230px;background:var(--bg);border:1px solid var(--btnline);border-radius:12px;padding:6px;box-shadow:0 12px 30px -14px rgba(0,0,0,.35);z-index:30;display:none;text-align:right}
.menu.open{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 12px;border:0;background:none;border-radius:8px;cursor:pointer;font-size:14.5px;font-weight:600;text-align:right}
.menu button:hover{background:var(--accbg)}
.menu svg{width:18px;height:18px;stroke:var(--acc2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* لوحة الموصّلات */
.ov{position:fixed;inset:0;background:rgba(20,16,8,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.open{display:flex}
.dlg{width:min(720px,100%);max-height:88vh;background:var(--bg);border:1px solid var(--btnline);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.dlg header h2{margin:0;font-size:19px}
.dlg .body{overflow:auto;padding:6px 20px 20px}
.dlg h3{font-size:14px;color:var(--mut);margin:18px 0 8px;font-weight:700}
.conn{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
.conn .ic{width:40px;height:40px;border-radius:10px;background:var(--accbg);display:grid;place-items:center;color:var(--acc);font-weight:800;font-size:20px;flex:none}
.conn .t{flex:1;min-width:0}
.conn .t b{display:block;font-size:15.5px}
.conn .t span{display:block;font-size:13px;color:var(--mut);line-height:1.6}
.st{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--accbg);color:var(--mut)}
.st.on{background:#dff0e7;color:var(--ok)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .st.on{background:#183a29;color:#7fd4a6}}
:root[data-theme=dark] .st.on{background:#183a29;color:#7fd4a6}
.drop{border:2px dashed var(--btnline);border-radius:14px;padding:22px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--acc);background:var(--accbg)}
.drop p{margin:0 0 10px;color:var(--mut);font-size:14.5px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.files{margin-top:12px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.files div{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
.files div:last-child{border:0}
.files em{font-style:normal;color:var(--mut);direction:ltr}
.addlib{display:flex;gap:8px;margin-top:8px}
.addlib input{flex:1;min-width:0;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:500 15px Cairo}

@media(max-width:860px){aside.side{display:none}nav.tabs a{font-size:13px}.ibtn span{display:none}}
@media(max-width:640px){header.top .in{grid-template-columns:auto 1fr auto;gap:8px}.logo span{display:none}nav.tabs{padding:3px}nav.tabs a{font-size:12px;height:32px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#"><i>ن</i><span>نواة</span></a>
  <nav class="tabs">
    <a href="/learn/">دروس</a><a href="/explain/">شروحات</a><a href="/dictionary/">معجم</a><a href="/docs/">الدليل</a><a href="/examples/">أمثلة</a><a href="/editor/">المحرر</a><a href="/roadmap/">الخارطة</a>
  </nav>
  <div class="tools">
    <button class="ibtn" id="openConn" title="الموصّلات"><svg viewBox="0 0 24 24"><path d="M9 7V3m6 4V3M7 11h10v3a5 5 0 0 1-10 0v-3zM12 19v2"/></svg><span>الموصّلات</span></button>
    <button class="ibtn" id="theme" aria-label="السمة">◐</button>
  </div>
</div></header>

<div class="app">
  <aside class="side">
    <button class="newchat" id="newchat"><svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>محادثة جديدة</button>
    <div class="hist" id="hist"><h6>المحادثات</h6><div class="none">لا محادثات بعد</div></div>
  </aside>

  <main class="ws">
    <div class="scroll" id="scroll"><div class="col" id="col">
      <div class="hero" id="hero"><div class="mark">ن</div><h1>ماذا تريد أن تبني اليوم؟</h1></div>
    </div></div>
    <div class="dock">
      <div class="composer">
        <div class="attached" id="attached"></div>
        <textarea id="in" rows="1" placeholder="اكتب طلبك هنا"></textarea>
        <div class="crow">
          <div style="position:relative">
            <button class="cbtn" id="plus" aria-label="إضافة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <div class="menu" id="menu">
              <button data-act="files"><svg viewBox="0 0 24 24"><path d="M21 12.5 12.5 21a5.5 5.5 0 0 1-8-8l9-9a3.8 3.8 0 0 1 5.4 5.4l-9 9a2 2 0 0 1-2.8-2.8l8.3-8.3"/></svg>إرفاق ملفات (PDF / DOCX)</button>
              <button data-act="folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>ربط مجلد ملفات</button>
              <button data-act="lib"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5zM4 19a2 2 0 0 0 2 2h12"/></svg>ربط مكتبة إسلامية</button>
            </div>
          </div>
          <span class="sp"></span>
          <button class="cbtn send" id="send" disabled aria-label="إرسال"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="chipsrow" id="chips">
        <button class="chip">اكتب لي برنامجًا بضاد</button><button class="chip">صحّح الخطأ في شيفرتي</button><button class="chip">اشرح لي هذه الدالة</button><button class="chip">ابحث في مكتبتي</button>
      </div>
    </div>
  </main>
</div>

<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true">
  <header><h2>الموصّلات</h2><button class="ibtn" id="closeConn">إغلاق</button></header>
  <div class="body">
    <h3>المكتبات الإسلامية</h3>
    <div id="libs"></div>
    <div class="addlib"><input id="libUrl" placeholder="رابط مكتبة أو مسارها"><button class="ibtn" id="addLib">إضافة</button></div>
    <h3>ملفات ومجلدات</h3>
    <div class="drop" id="drop">
      <p>اسحب ملفات PDF أو DOCX أو مجلدًا كاملًا إلى هنا</p>
      <div class="row"><button class="ibtn" id="pickFiles">اختيار ملفات</button><button class="ibtn" id="pickFolder">اختيار مجلد</button></div>
      <div class="files" id="files" hidden></div>
    </div>
    <input type="file" id="fileIn" multiple accept=".pdf,.docx,.doc,.txt,.md" hidden>
    <input type="file" id="dirIn" webkitdirectory multiple hidden>
  </div>
</div></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var ls=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
// السمة
var cur=ls('dhad.site.theme');if(cur)document.documentElement.setAttribute('data-theme',cur);
$('#theme').onclick=function(){var d=document.documentElement,dark=d.getAttribute('data-theme')==='dark'||(!d.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);var n=dark?'light':'dark';d.setAttribute('data-theme',n);ls('dhad.site.theme',n)};

// المحادثة
var inp=$('#in'),send=$('#send'),col=$('#col'),hero=$('#hero'),scroll=$('#scroll'),hist=$('#hist');
var attached=[],convs=[];
function grow(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px';send.disabled=!inp.value.trim()}
inp.addEventListener('input',grow);
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
send.onclick=go;
document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){inp.value=c.textContent;grow();inp.focus()}});
function add(role,text){var d=document.createElement('div');d.className='msg '+(role==='u'?'u':'a');d.innerHTML='<div class="av">'+(role==='u'?'أ':'ن')+'</div><div class="tx"></div>';d.querySelector('.tx').textContent=text;col.appendChild(d);scroll.scrollTop=scroll.scrollHeight;return d}
function go(){var t=inp.value.trim();if(!t)return;if(hero){hero.remove();hero=null;$('#chips').style.display='none'}
  add('u',t);inp.value='';grow();
  if(!convs.length||convs[0].done){convs.unshift({t:t});renderHist()}
  var r=add('a','…');setTimeout(function(){r.querySelector('.tx').textContent='هذه معاينة للتصميم؛ المنسّق يُوصل بعد اعتماده.'},500)}
function renderHist(){hist.innerHTML='<h6>المحادثات</h6>';convs.forEach(function(c,i){var b=document.createElement('button');b.textContent=c.t;if(i===0)b.className='on';hist.appendChild(b)})}
$('#newchat').onclick=function(){col.innerHTML='';hero=document.createElement('div');hero.className='hero';hero.id='hero';hero.innerHTML='<div class="mark">ن</div><h1>ماذا تريد أن تبني اليوم؟</h1>';col.appendChild(hero);$('#chips').style.display='';if(convs[0])convs[0].done=true;inp.focus()};

// قائمة +
var menu=$('#menu');$('#plus').onclick=function(e){e.stopPropagation();menu.classList.toggle('open')};
document.addEventListener('click',function(){menu.classList.remove('open')});
menu.querySelectorAll('button').forEach(function(b){b.onclick=function(){var a=b.dataset.act;if(a==='files')$('#fileIn').click();else{openConn()}}});

// الموصّلات
var LIBS=[['ش','المكتبة الشاملة','كتب التراث الإسلامي المفهرسة'],['و','المكتبة الوقفية','كتب ومراجع بصيغة PDF'],['ن','مكتبة نور','كتب عربية وإسلامية']];
var linked=JSON.parse(ls('nawa.libs')||'{}');
function renderLibs(){var h='';LIBS.forEach(function(l,i){var on=!!linked[i];h+='<div class="conn"><div class="ic">'+l[0]+'</div><div class="t"><b>'+l[1]+'</b><span>'+l[2]+'</span></div><span class="st'+(on?' on':'')+'">'+(on?'مرتبطة':'غير مرتبطة')+'</span><button class="ibtn" data-i="'+i+'">'+(on?'فصل':'ربط')+'</button></div>'});$('#libs').innerHTML=h;
  $('#libs').querySelectorAll('button').forEach(function(b){b.onclick=function(){var i=b.dataset.i;if(linked[i])delete linked[i];else linked[i]=1;ls('nawa.libs',JSON.stringify(linked));renderLibs()}})}
renderLibs();
function openConn(){$('#ov').classList.add('open')}
$('#openConn').onclick=openConn;
$('#closeConn').onclick=function(){$('#ov').classList.remove('open')};
$('#ov').onclick=function(e){if(e.target===this)this.classList.remove('open')};
$('#addLib').onclick=function(){var v=$('#libUrl').value.trim();if(!v)return;LIBS.push([v.replace(/^https?:\/\//,'').charAt(0)||'+',v,'مكتبة مضافة']);linked[LIBS.length-1]=1;ls('nawa.libs',JSON.stringify(linked));$('#libUrl').value='';renderLibs()};

// ملفات ومجلدات
var box=$('#files');
function take(list){var arr=[].slice.call(list).filter(function(f){return /\.(pdf|docx?|txt|md)$/i.test(f.name)});
  arr.forEach(function(f){attached.push(f)});showFiles(arr);chips()}
function showFiles(arr){box.hidden=false;box.innerHTML='';arr.slice(0,200).forEach(function(f){var d=document.createElement('div');d.innerHTML='<span></span><em></em>';d.firstChild.textContent=f.webkitRelativePath||f.name;d.lastChild.textContent=(f.size/1024).toFixed(0)+' KB';box.appendChild(d)})}
function chips(){var a=$('#attached');a.innerHTML='';if(!attached.length)return;var pdf=attached.filter(function(f){return /\.pdf$/i.test(f.name)}).length,doc=attached.filter(function(f){return /\.docx?$/i.test(f.name)}).length;
  var s=document.createElement('span');s.className='att';s.innerHTML='<b>'+attached.length+'</b> ملف'+(pdf||doc?' ('+(pdf?pdf+' PDF':'')+(pdf&&doc?'، ':'')+(doc?doc+' DOCX':'')+')':'');a.appendChild(s)}
$('#pickFiles').onclick=function(){$('#fileIn').click()};
$('#pickFolder').onclick=function(){$('#dirIn').click()};
$('#fileIn').onchange=function(){take(this.files);this.value=''};
$('#dirIn').onchange=function(){take(this.files);this.value=''};
var drop=$('#drop');['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
drop.addEventListener('drop',function(e){take(e.dataTransfer.files)});
})();
</script>
</body>
</html>
