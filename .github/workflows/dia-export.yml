name: dia-export
# يجلب أوزان المُشكِّل من مخرجات كاجل ويحوّلها إلى صيغة المتصفح (int8) ويلتزمها في site/assets/dia.
on:
  workflow_dispatch:
    inputs:
      list_only: { description: 'سرد النوتبوكات فقط (1) أو التصدير (0)', default: '1' }
      kernel: { description: 'مرجع النوتبوك user/slug', default: '' }
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip -q install kaggle six python-slugify requests tqdm numpy
      - name: سرد
        if: inputs.list_only == '1'
        run: kaggle kernels list --mine --page-size 50 2>&1 | head -60
      - name: جلب وتصدير
        if: inputs.list_only != '1'
        run: |
          mkdir -p kout && kaggle kernels output ${KAGGLE_USERNAME}/${{ inputs.kernel }} -p kout
          find kout -type f | head -30
          P=$(find kout -name 'dia_big.npz' | head -1); P=${P%.npz}; echo "prefix: $P"
          git clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/OpenITI/0500AH.git t500 && (cd t500 && git sparse-checkout set --no-cone 'data/0476AbuIshaqShirazi/0476AbuIshaqShirazi.MuhadhdhabFiFiqh/*Shamela0011813-ara1' && git checkout -q)
          T=$(find t500 -type f -name '*Shamela0011813*' | grep -v yml | head -1)
          python3 tools/dia_export_js.py "$P" site/assets/dia "$T"
          ls -la site/assets/dia
      - name: التزام الأوزان
        if: inputs.list_only != '1'
        run: |
          git config user.name nawa-builder; git config user.email builder@nawa.local
          git add site/assets/dia && git commit -qm "المُشكِّل: أوزان المتصفح (int8/fp16) من مخرجات كاجل، DER اختبار مستقل 5.59٪ (بيانات Open-Hadith-Data ODbL، العمل المنتَج)" && git pull -q --rebase origin main && git push -q origin HEAD:main
