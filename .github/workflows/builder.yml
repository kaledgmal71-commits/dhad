name: builder
# يشغّل عامل البناء على Kaggle تلقائيًا عند إضافة مهام للطابور أو دوريًا، ثم يجمع النتائج في الفرع builder-results.
on:
  workflow_dispatch:
    inputs:
      model: { description: 'معرّف النموذج على Hugging Face', default: 'Qwen/Qwen3-8B' }
      tag: { description: 'وسم مقارنة (يكتب النتائج في results/<وسم> دون المساس بالأساس)', default: '' }
      only: { description: 'تعبير منتظم لمعرّفات المهام (فارغ = الكل)', default: '' }
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['tools/builder/tasks/**', '.github/workflows/builder.yml']
concurrency: builder
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MODEL: ${{ inputs.model || 'Qwen/Qwen3-8B' }}
      TAG: ${{ inputs.tag || '' }}
      ONLY: ${{ inputs.only || '' }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: هل في الطابور مهام جديدة؟
        id: chk
        run: |
          DP=results${TAG:+/$TAG}/done.json
          curl -sf https://raw.githubusercontent.com/${{ github.repository }}/builder-results/$DP -o done.json || echo '{}' > done.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,glob
          done=json.load(open('done.json'))
          new=[json.load(open(f,encoding='utf8'))['id'] for f in sorted(glob.glob('tools/builder/tasks/*.json'))]
          new=[i for i in new if i not in done]
          print('new='+str(len(new)))
          PY
      - name: تشغيل Kaggle
        if: steps.chk.outputs.new != '0'
        run: |
          pip -q install kaggle six python-slugify requests tqdm
          [ -n "$KAGGLE_USERNAME" ] || { echo "سرّ KAGGLE_USERNAME غير مضبوط"; exit 1; }
          mkdir kd && cp tools/builder/kernel/nawa-builder.py kd/ && sed "s/__USER__/${KAGGLE_USERNAME}/" tools/builder/kernel/kernel-metadata.json > kd/kernel-metadata.json
          DP=results${TAG:+/$TAG}/done.json
          sed -i "s#__MODEL__#${MODEL}#; s#__DONEPATH__#${DP}#; s#__ONLY__#${ONLY}#" kd/nawa-builder.py
          kaggle kernels push -p kd
          for i in $(seq 1 150); do
            sleep 120
            S=$(kaggle kernels status ${KAGGLE_USERNAME}/nawa-builder 2>&1 | tr -d '\n'); echo "$S"
            case "$S" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
          done
          mkdir -p out && kaggle kernels output ${KAGGLE_USERNAME}/nawa-builder -p out || true
          ls -la out
      - name: دفع النتائج إلى builder-results
        if: steps.chk.outputs.new != '0'
        run: |
          git config user.name nawa-builder; git config user.email builder@nawa.local
          git fetch origin builder-results 2>/dev/null && git checkout -B builder-results origin/builder-results || { git checkout --orphan builder-results; git rm -rfq .; }
          DEST=results${TAG:+/$TAG}; mkdir -p $DEST status
          find out/out -maxdepth 1 -name "*.json" -exec cp {} $DEST/ \; 2>/dev/null || true
          DEST=$DEST python3 - <<'PY'
          import json,os
          D=os.environ['DEST']; dn=D+'/done.json'; nw=D+'/done_new.json'
          d=json.load(open(dn)) if os.path.exists(dn) else {}
          if os.path.exists(nw): d.update(json.load(open(nw))); os.remove(nw)
          json.dump(d,open(dn,'w',encoding='utf8'),ensure_ascii=False,indent=1)
          PY
          (date -u; ls out; tail -c 3000 out/*.log 2>/dev/null) > status/worker.txt || true
          git add results status; git commit -qm "نتائج دفعة البناء" || echo "لا جديد"
          git push origin builder-results
