name: train
# تدريب نموذج نواة الخاص على Kaggle ورفع نقاط الحفظ إلى Hugging Face (مستودع خاص). الأوزان لا تدخل هذا المستودع.
on:
  workflow_dispatch:
    inputs:
      preset: { description: 'smoke | small | base', default: 'smoke' }
      hours: { description: 'مدة التشغيل بالساعات', default: '1.5' }
      centuries: { description: 'مستودعات OpenITI مفصولة بفاصلة', default: '0300AH,0400AH,0500AH' }
      wiki_docs: { description: 'عدد وثائق ويكيبيديا العربية (0 = بدون)', default: '0' }
      steps: { description: 'أفق جدول المعدل بالخطوات (فارغ = افتراضي الإعداد)', default: '' }
concurrency: lm
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PRESET: ${{ inputs.preset }}
      HOURS: ${{ inputs.hours }}
      CENT: ${{ inputs.centuries }}
      WIKI: ${{ inputs.wiki_docs }}
      STEPS: ${{ inputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: تشغيل التدريب على Kaggle
        run: |
          pip -q install kaggle six python-slugify requests tqdm
          mkdir kd && cp tools/lm/kernel/nawa-lm.py kd/ && sed "s/__USER__/${KAGGLE_USERNAME}/" tools/lm/kernel/kernel-metadata.json > kd/kernel-metadata.json
          sed -i "s#__PRESET__#${PRESET}#; s#__HOURS__#${HOURS}#; s#__HF__#${HF_TOKEN}#; s#__CENT__#${CENT}#; s#__WIKI__#${WIKI}#; s#__STEPS__#${STEPS}#" kd/nawa-lm.py
          kaggle kernels push -p kd
          N=$(python3 -c "print(int(float('${HOURS}')*30)+40)")
          for i in $(seq 1 $N); do
            sleep 120
            S=$(kaggle kernels status ${KAGGLE_USERNAME}/nawa-lm 2>&1 | tr -d '\n'); echo "$S"
            case "$S" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
          done
          mkdir -p out && kaggle kernels output ${KAGGLE_USERNAME}/nawa-lm -p out || true
          ls -la out
      - name: دفع السجل إلى builder-results
        if: always()
        run: |
          git config user.name nawa-builder; git config user.email builder@nawa.local
          git fetch origin builder-results 2>/dev/null && git checkout -B builder-results origin/builder-results || { git checkout --orphan builder-results; git rm -rfq .; }
          mkdir -p lm
          python3 - <<'PY'
          import glob, json, re
          out = ''
          for f in glob.glob('out/*.log'):
              try:
                  for l in open(f, encoding='utf8'):
                      l = l.strip().lstrip('[').rstrip(',').rstrip(']')
                      if l.startswith('{') and 'data' in l:
                          try: out += json.loads(l)['data']
                          except Exception: pass
                      elif l not in ('[', ']'): out += l + '\n'
              except Exception: pass
          out = re.sub(r'hf_[A-Za-z0-9]{20,}', '***', out)
          open('lm/last-log.txt', 'w', encoding='utf8').write(out[-60000:])
          PY
          git add lm; git commit -qm "سجل تدريب نواة" || echo "لا جديد"
          git push origin builder-results
