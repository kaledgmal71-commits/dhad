name: check-secrets
# يتحقق من أن الأسرار المضبوطة تعمل (دون طباعة أي قيمة)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Hugging Face
        run: |
          [ -n "$HF_TOKEN" ] || { echo "HF_TOKEN غير مضبوط"; exit 1; }
          curl -s -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 | python3 -c "import sys,json; d=json.load(sys.stdin); print('الحساب:', d.get('name')); a=d.get('auth',{}).get('accessToken',{}); print('نوع المفتاح:', a.get('role') or a.get('displayName'))"
